# Portable project configuration. Keep credentials in your environment.
[mcp_servers.roblox_studio]
command = "cmd.exe"
args = ["/d", "/s", "/c", "scripts\\roblox-mcp.cmd"]

# Subagent settings: lanes are the lead's subagents and may spawn their own judges and workers.
[agents]
max_depth = 2
max_concurrent_threads_per_session = 8

# Lanes. Custom subagents the lead spawns by name; the lead itself is AGENTS.md.
# Descriptions tell the lead what each lane owns; craft lives in the lane file and the skills.

[agents."world"]
description = "The world lane (session `world`): kit pieces, hero structures, terrain, vegetation and Blender lighting matched to the scene's target frame, exported as verified GLB. Works from task cards on the board; reports with the contract markers."
config_file = "agents/world.toml"

[agents."creatures"]
description = "The creatures lane (session `creatures`): player accessories and clothing textures, NPC and monster models, R15 / Auto Setup rigs, animations, verified in Studio."
config_file = "agents/creatures.toml"

[agents."vfx"]
description = "The effects lane (session `vfx`): cues from anticipation to dissipate, mesh effects and flipbooks in Blender, particles, beams, camera work and the client presentation code in Roblox; sequences for set pieces; judged by clips."
config_file = "agents/vfx.toml"

[agents."code"]
description = "The code lane (session `code`): controller, abilities, combat, enemy AI, quest logic, saves and remotes built to game/DESIGN.md and the scene's gameplay.md; publishes the presentation interface; luau gate and independent review before every report."
config_file = "agents/code.toml"

[agents."design"]
description = "The design lane (session `design`): core loop and pillars, system specs in game/DESIGN.md, per-scene gameplay.md with encounters, mechanics and feel targets, tuning from playtest and completion reports. Works one scene ahead with story."
config_file = "agents/design.toml"

[agents."story"]
description = "The story lane (session `story`): lore bible, ordered scene plan, per-scene script (places, NPCs with schedules and lines, quests with choices and consequences) and the scene contract every other lane builds against. Works one scene ahead."
config_file = "agents/story.toml"

[agents."studio"]
description = "The studio lane (session `studio`): imports GLB into Roblox Studio, assembles the scene to the Blender layout, matches Roblox lighting to the render, places audio, runs playtests and the computer-player completion under the exclusive lease, captures and exports builds."
config_file = "agents/studio.toml"

[agents."ui"]
description = "The interface lane (session `ui`): HUD, menus, prompts, dialogue and quest screens designed to a generated mockup, built with the style sheet and UI art assets, checked at phone, tablet and desktop viewports; client UI code."
config_file = "agents/ui.toml"

[agents."audio"]
description = "The audio lane (session `audio`): sound effects, ambiences, music and adaptive layers from open sources and local generation only, passed through objective gates, catalogued with provenance, delivered as a placement package for studio."
config_file = "agents/audio.toml"

[agents."dev"]
description = "The dev lane (session `dev`): the studio's own architect. After each accepted scene, or on the owner's request, diagnoses the run from digests and trajectories, fixes lane files, skills and tools on the right level and rewrites files whole; a fresh AUDIT instance judges every change. Never edits the game."
config_file = "agents/dev.toml"

# Judge subagents: spawned by a lane by name, never a session (docs/contract.md §8).

[agents."luau-reviewer"]
description = "Judge subagent: independent read-only review of every executable script in the place, spawned by the code lane after its gate; returns addressed findings and a verdict, never edits."
config_file = "agents/luau-reviewer.toml"

[agents."computer-player"]
description = "Judge subagent: earned completion of the accepted build with ordinary controls under the studio lane's exclusive lease, plus feel observations from frames; never edits, never teleports."
config_file = "agents/computer-player.toml"
