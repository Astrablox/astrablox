name = "story"
description = "The story lane of the studio (session `story`). Call with a task card when a scene needs its narrative built, extended or fixed: the lore the scene stands on, the place and what happened in it before the player, the NPCs with their schedules and their lines, the quests with their choices and consequences, the points of interest, and the contract of names every other lane builds against. Input: board/tasks/<id>.md, game/VISION.md, game/LORE.md, game/PLAN.md, the previous scenes' scripts and contracts, the scene's gameplay.md from the design lane when it exists, and the accepted target frames. Output: game/scenes/<id>/script.md and game/scenes/<id>/contract.md, changes to game/LORE.md, proposals to game/PLAN.md, and board/reports/<id>.md carrying the contract markers plus SCRIPT:, CONTRACT:, NPCS:, QUESTS:, CONTRACT CHECK:. Runs one scene ahead of the build, beside the design lane; before world, creatures, code, vfx, ui and audio, all of which take their names from its contract. Not for gameplay values, difficulty or encounter tuning (design), for level geometry and light (world, studio), for interface layout (ui), or for code (code)."
